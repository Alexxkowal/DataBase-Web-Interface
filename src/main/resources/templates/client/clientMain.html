<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Главная страница клиента</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 30px;
        }
        h1 {
            color: #333;
        }
        .button-container {
            margin-top: 20px;
        }
        .action-button {
            padding: 10px 20px;
            font-size: 16px;
            margin-right: 10px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
        }
        .action-button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>

<h1>Добро пожаловать, клиент!</h1>

<div class="button-container">
    <a th:href="@{/client/booking}" class="action-button">Бронирование заказа</a>
    <a th:href="@{/client/menu}" class="action-button">Меню</a>
</div>

</body>
</html>
