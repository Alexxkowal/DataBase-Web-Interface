<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Управление категориями блюд</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<header>
    <h1>Управление категориями блюд</h1>
    <nav>
        <ul>
            <li><a href="/admin/adminMain">Главная</a></li>
            <li><a href="/admin/dish_categories">Категории блюд</a></li>
        </ul>
    </nav>
</header>

<section>
    <h2>Список категорий</h2>

    <table border="1">
        <thead>
        <tr>
            <th>ID</th>
            <th>Название категории</th>
            <th>Действия</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="category : ${categories.content}">
            <td th:text="${category.id}"></td>
            <td th:text="${category.categoryName}"></td>
            <td>
                <a th:href="@{/admin/dish_categories/{id}/edit(id=${category.id})}">Редактировать</a>
                <a th:href="@{/admin/dish_categories/{id}/delete(id=${category.id})}" onclick="return confirm('Удалить категорию?');">Удалить</a>
            </td>
        </tr>
        </tbody>
    </table>

    <h3>Добавить новую категорию</h3>
    <form th:action="@{/admin/dish_categories/add}" method="post" th:object="${newCategory}">
        <label for="categoryName">Название категории:</label>
        <input type="text" id="categoryName" th:field="*{categoryName}" maxlength="100" required>
        <button type="submit">Добавить категорию</button>
    </form>
</section>

<div>
    <span th:text="'Страница ' + ${currentPage + 1} + ' из ' + ${totalPages}"></span>
    <div>
        <a th:if="${currentPage > 0}" th:href="@{/admin/dish_categories(page=${currentPage - 1})}">Назад</a>
        <a th:if="${currentPage + 1 < totalPages}" th:href="@{/admin/dish_categories(page=${currentPage + 1})}">Вперёд</a>
    </div>
</div>

</body>
</html>
