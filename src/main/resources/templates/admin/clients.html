<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Управление клиентами</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<header>
    <h1>Список клиентов</h1>
    <nav>
        <ul>
            <li><a href="/admin/adminMain">Главная</a></li>
            <li><a href="/admin/clients">Клиенты</a></li>
        </ul>
    </nav>
</header>

<section>
    <table border="1">
        <thead>
            <tr>
                <th>ID</th>
                <th>Имя</th>
                <th>Почта</th>
                <th>Скидка</th>
                <th>Действия</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="client : ${clients.content}">
                <td th:text="${client.id}"></td>
                <td th:text="${client.name}"></td>
                <td th:text="${client.mail}"></td>
                <td th:text="${client.discount}"></td>
                <td>
                    <a th:href="@{/admin/clients/{id}/edit(id=${client.id})}">Редактировать</a>
                    <a th:href="@{/admin/clients/{id}/delete(id=${client.id})}"
                       onclick="return confirm('Вы уверены, что хотите удалить?');">Удалить</a>
                </td>
            </tr>
        </tbody>
    </table>

    <h3>Добавить нового клиента</h3>
    <form th:action="@{/admin/clients/add}" method="post" th:object="${newClient}">
        <label for="name">Имя:</label>
        <input type="text" id="name" th:field="*{name}" required>

        <label for="mail">Почта:</label>
        <input type="email" id="mail" th:field="*{mail}" required>

        <label for="discount">Скидка:</label>
        <input type="number" id="discount" th:field="*{discount}" step="0.01" min="0" max="100">

        <button type="submit">Добавить клиента</button>
    </form>
</section>

<div>
    <span th:text="'Страница ' + (${currentPage} + 1) + ' из ' + ${totalPages}"></span>
    <div>
        <a th:if="${currentPage > 0}" th:href="@{/admin/clients(page=${currentPage - 1})}">Назад</a>
        <a th:if="${currentPage + 1 < totalPages}" th:href="@{/admin/clients(page=${currentPage + 1})}">Вперёд</a>
    </div>
</div>

</body>
</html>
