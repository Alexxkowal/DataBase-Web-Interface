<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Редактировать стол</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<header>
    <h1>Редактировать стол</h1>
</header>

<section>
    <form th:action="@{/admin/tables/{id}/update(id=${table.id})}" method="post">
        <label for="capacity">Вместимость:</label>
        <input type="number" id="capacity" name="capacity" min="1" th:value="${table.capacity}" required>

        <label for="zone">Зона:</label>
        <input type="text" id="zone" name="zone" maxlength="100" th:value="${table.zone}" required>

        <button type="submit">Сохранить изменения</button>
    </form>
    <a href="/admin/tables">Назад к списку</a>
</section>
</body>
</html>
