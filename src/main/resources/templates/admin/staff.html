<!-- admin/staff.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Сотрудники</title></head>
<body>
<h2>Список сотрудников</h2>
<table border="1">
    <tr><th>ID</th><th>Имя</th><th>Должность</th></tr>
    <tr th:each="staff : ${staffList}">
        <td th:text="${staff.id}"></td>
        <td th:text="${staff.name}"></td>
        <td th:text="${staff.position}"></td>
    </tr>
</table>
</body>
</html>
