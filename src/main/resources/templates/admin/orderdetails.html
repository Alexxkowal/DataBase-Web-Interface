<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Детали заказов</title>
    <link rel="stylesheet" href="/css/styles.css" />
    <style>
        .pagination {
            margin: 20px 0;
            display: flex;
            justify-content: center;
            gap: 10px;
        }
        .pagination a {
            padding: 5px 10px;
            border: 1px solid #ddd;
            text-decoration: none;
            color: #333;
        }
        .pagination a:hover {
            background-color: #f5f5f5;
        }
        .pagination span {
            padding: 5px 10px;
            color: #999;
            border: 1px solid #eee;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 8px 12px;
            border: 1px solid #ddd;
        }
        a.action-link {
            margin-right: 10px;
            color: blue;
            text-decoration: underline;
            cursor: pointer;
        }
    </style>
</head>
<body>
<header>
    <h1>Управление деталями заказов</h1>
    <nav>
        <ul>
            <li><a href="/admin/adminMain">Главная</a></li>
            <li><a href="/admin/orders">Заказы</a></li>
        </ul>
    </nav>
</header>

<section>
    <h2>Список деталей заказов</h2>

    <!-- Форма фильтрации -->
    <h3>Фильтр</h3>
    <form th:action="@{/admin/orderdetails}" method="get">
        <label for="filterOrderId">ID заказа:</label>
        <input type="number" id="filterOrderId" name="orderId" th:value="${param.orderId}" />

        <label for="filterDishName">Название блюда:</label>
        <input type="text" id="filterDishName" name="dishName" th:value="${param.dishName}" />

        <button type="submit">Фильтровать</button>
    </form>

    <!-- Таблица -->
    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Заказ</th>
            <th>Блюдо</th>
            <th>Количество</th>
            <th>Действия</th> <!-- Новый столбец -->
        </tr>
        </thead>
        <tbody>
        <tr th:each="detail : ${orderDetails.content}">
            <td th:text="${detail.id}"></td>
            <td th:text="'Заказ #' + ${detail.order.id}"></td>
            <td th:text="${detail.dish.name}"></td>
            <td th:text="${detail.quantity}"></td>
            <td>
                <a th:href="@{/admin/orderdetails/{id}/edit(id=${detail.id})}" class="action-link">Редактировать</a>
                <a th:href="@{/admin/orderdetails/{id}/delete(id=${detail.id})}"
                   onclick="return confirm('Вы уверены, что хотите удалить эту деталь заказа?');"
                   class="action-link">Удалить</a>
            </td>
        </tr>
        </tbody>
    </table>

    <!-- Пагинация -->
    <div class="pagination">
        <a th:if="${!orderDetails.first}"
           th:href="@{/admin/orderdetails(size=${param.size != null ? param.size : 10}, page=${orderDetails.number - 1}, orderId=${param.orderId}, dishName=${param.dishName})}">
            ← Назад
        </a>
        <span th:if="${orderDetails.first}">← Назад</span>

        <span>Страница <span th:text="${orderDetails.number + 1}"></span></span>

        <a th:if="${!orderDetails.last}"
           th:href="@{/admin/orderdetails(size=${param.size != null ? param.size : 10}, page=${orderDetails.number + 1}, orderId=${param.orderId}, dishName=${param.dishName})}">
            Вперед →
        </a>
        <span th:if="${orderDetails.last}">Вперед →</span>
    </div>

    <!-- Добавление детали -->
    <h3>Добавить деталь заказа</h3>
    <form action="#" th:action="@{/admin/orderdetails/add}" method="post">
        <label for="orderId">ID заказа:</label>
        <input type="number" id="orderId" name="order.id" min="1" required />

        <label for="dishId">ID блюда:</label>
        <input type="number" id="dishId" name="dish.id" min="1" required />

        <label for="quantity">Количество:</label>
        <input type="number" id="quantity" name="quantity" min="1" required />

        <button type="submit">Добавить</button>
    </form>
</section>

</body>
</html>
