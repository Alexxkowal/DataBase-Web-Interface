<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Редактирование состава</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<header>
    <h1>Редактирование состава блюда</h1>
    <nav>
        <ul>
            <li><a href="/admin/adminMain">Главная</a></li>
            <li><a href="/admin/compounds">Составы</a></li>
        </ul>
    </nav>
</header>

<h2>Редактировать информацию о составе</h2>
<form th:action="@{/admin/compounds/{id}/update(id=${compound.id})}" th:object="${compound}" method="post">
    <label for="productId">ID Продукта:</label>
    <input type="number" id="productId" th:field="*{productId}" required>

    <label for="dishId">ID Блюда:</label>
    <input type="number" id="dishId" th:field="*{dishId}" required>

    <label for="productQuantity">Количество продукта:</label>
    <input type="number" id="productQuantity" th:field="*{productQuantity}" step="0.01" required>

    <button type="submit">Сохранить изменения</button>
</form>
</body>
</html>
