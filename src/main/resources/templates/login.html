<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Вход / Регистрация</title>
    <style>
        .form-container {
            margin-bottom: 20px;
        }
        .hidden {
            display: none;
        }
    </style>
    <script>
        function toggleRoleFields() {
            const role = document.querySelector('input[name="role"]:checked').value;
            document.getElementById("adminPasswordField").style.display = role === 'admin' ? 'block' : 'none';
            document.getElementById("clientLoginFields").style.display = role === 'client' ? 'block' : 'none';
            document.getElementById("registerToggleBtn").style.display = role === 'client' ? 'inline' : 'none';

            // Скрываем форму регистрации при смене роли
            document.getElementById("clientRegisterFields").style.display = 'none';
            document.getElementById("loginForm").style.display = 'block';
        }

        function toggleRegisterForm() {
            const registerDiv = document.getElementById("clientRegisterFields");
            const loginDiv = document.getElementById("loginForm");
            if (registerDiv.style.display === 'none' || registerDiv.style.display === '') {
                registerDiv.style.display = 'block';
                loginDiv.style.display = 'none';
            } else {
                registerDiv.style.display = 'none';
                loginDiv.style.display = 'block';
            }
        }

        window.onload = toggleRoleFields;
    </script>
</head>
<body>

<h1>Вход в систему</h1>

<div id="loginForm" class="form-container">
    <form th:action="@{/login}" method="post" th:object="${loginForm}">
        <label>
            <input type="radio" name="role" value="client" checked onclick="toggleRoleFields()"> Клиент
        </label>
        <label>
            <input type="radio" name="role" value="admin" onclick="toggleRoleFields()"> Администратор
        </label>

        <div id="adminPasswordField" class="hidden">
            <label>Пароль администратора:</label><br>
            <input type="password" name="adminPassword" th:field="*{adminPassword}"><br>
        </div>

        <div id="clientLoginFields">
            <label>Почта:</label><br>
            <input type="email" name="email" th:field="*{email}"><br>
        </div>

        <button type="submit" style="margin-top: 10px;">Войти</button>
    </form>
</div>

<button id="registerToggleBtn" onclick="toggleRegisterForm()" style="margin-top: 20px;">Зарегистрироваться</button>

<div id="clientRegisterFields" class="form-container hidden">
    <h2>Регистрация клиента</h2>
    <form th:action="@{/register}" method="post" th:object="${registerForm}">
        <label>Почта:</label><br>
        <input type="email" name="email" th:field="*{email}" required><br>

        <label>Номер телефона:</label><br>
        <input type="tel" name="phone" th:field="*{phone}" pattern="^\+?[0-9\s\-]{7,15}$" required><br>

        <label for="name">Имя:</label>
        <input type="text" id="name" name="name" th:field="*{name}" required/><br/>


        <button type="submit" style="margin-top: 10px;">Зарегистрироваться</button>
    </form>
</div>

<p th:if="${error}" th:text="${error}" style="color:red; margin-top: 20px;"></p>
<p th:if="${message}" th:text="${message}" style="color:green; margin-top: 20px;"></p>

</body>
</html>
